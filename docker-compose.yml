services:
  kyx-kernel:
    build:
      context: .
      dockerfile: Dockerfile
    image: kyx/kernel
    container_name: kyx-kernel-app
    environment:
      - ENVIRONMENT=production
      - PORT=8080
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@host.docker.internal:5435/${DB_NAME}
      - REDIS_URL=rediss://host.docker.internal:6381
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENGINE_SECRET_KEY=${ENGINE_SECRET_KEY}
      - APP_VERSION=${APP_VERSION:-0.1.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./assets:/app/assets
      - ./uploads:/app/uploads
    restart: always

volumes:
  kyx_postgres_data_success:
  postgres_data:
  redis_data:

networks:
  default:
    name: kyx-network
